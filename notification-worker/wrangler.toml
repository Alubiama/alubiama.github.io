name = "stillbasing-notifications"
main = "worker.js"
compatibility_date = "2024-12-01"

# KV namespace for storing notification tokens
# Create with: wrangler kv namespace create NOTIF_TOKENS
# Then replace the id below with the actual ID
[[kv_namespaces]]
binding = "NOTIF_TOKENS"
id = "YOUR_KV_NAMESPACE_ID_HERE"

# Daily reminder at 9:00 UTC
[triggers]
crons = ["0 9 * * *"]
